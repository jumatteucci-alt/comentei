name: Fix animation timeline controls
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-animation-timeline-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_animation_timeline_controls.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "feat: improve animation timeline navigation and layer ordering"
          git push origin main
