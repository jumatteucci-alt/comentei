name: Fix text vector 3D and path
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-text-vector-3d-path.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_text_vector_3d_path.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: repair text 3D vector conversion and add text on path"
          git push origin main
