name: Apply editable 3D shapes update
on:
  push:
    paths:
      - '.github/workflows/chatgpt-shape-3d.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch editor
        run: python .github/scripts/apply_shape_3d.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit change
        run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "feat: add editable 3d extrusion for shapes"
          git push origin main
