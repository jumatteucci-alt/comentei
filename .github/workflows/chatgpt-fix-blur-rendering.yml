name: Fix blur rendering
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-blur-rendering.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/fix_blur_rendering.py
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: blur spills across shape and image edges"
          git push origin main
