name: Fix pen and canvas transform
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-pen-canvas-transform.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/fix_pen_canvas_transform.py
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: pen completion canvas resize and canvas transform"
          git push origin main

# apply-2
