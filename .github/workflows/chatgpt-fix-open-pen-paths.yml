name: Fix open Pen paths
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-open-pen-paths.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_open_pen_paths.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: keep open Pen paths persistent and motion-ready"
          git push origin main

# retrigger
