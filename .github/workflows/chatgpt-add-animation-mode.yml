name: Add animation mode
on:
  push:
    paths:
      - '.github/workflows/chatgpt-add-animation-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/add_animation_mode.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "feat: add animation mode timeline"
          git push origin main
