name: Fix canvas selection
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-selection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/scripts/fix_canvas_selection.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit editor changes
        run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: restore reliable canvas selection"
          git push origin main
