name: Extend 3D to text and pen shapes
on:
  push:
    paths:
      - '.github/workflows/chatgpt-3d-text-pen.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/extend_3d_text_pen.py
      - name: Commit editor changes
        run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "feat: add 3d text and pen shapes"
          git push origin main
