name: Fix text path coordinates
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-text-path-coordinates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_text_path_coordinates.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: keep text aligned to a single visible path guide"
          git push origin main
