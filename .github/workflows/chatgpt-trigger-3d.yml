name: Apply motion path and animation export
on:
  push:
    paths:
      - '.github/workflows/chatgpt-trigger-3d.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/add_motion_path_export.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "feat: add motion paths and WebM animation export"
          git push origin main

# retrigger motion path export
