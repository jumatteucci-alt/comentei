name: Trigger 3D shapes workflow
on:
  push:
    paths:
      - '.github/workflows/chatgpt-trigger-3d.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Touch 3D workflow
        run: |
          printf '\n# trigger\n' >> .github/workflows/chatgpt-shape-3d.yml
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/chatgpt-shape-3d.yml
          git commit -m "chore: trigger editable 3d shapes workflow"
          git push origin main

# retrigger
