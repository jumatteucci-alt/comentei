name: Fix path selection and resize
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-path-selection-resize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_path_selection_resize.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "chatgpt-editor"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/canvas/editor/page.tsx
          git commit -m "fix: pen path selection and object resize"
          git push origin main

# trigger
